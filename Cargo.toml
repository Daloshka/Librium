[package]
name = "librium"
version = "0.5.2"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
http-body-util = "0.1"
hyper-tungstenite = "0.19"
hudsucker = { version = "=0.24.1", features = ["http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.40.2", features = ["bundled", "functions"] }
url = "2.5.8"
fastwebsockets = { version = "=0.10.0", default-features = false, features = ["unstable-split"] }
tokio-rustls = { version = "0.26", default-features = false }
webpki-roots = "1"
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[[example]]
name = "ws-fixture-cert"
path = "scripts/ws-fixture-cert.rs"
