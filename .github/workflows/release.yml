name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Rust toolchain
        run: rustup update stable
      - name: Build installers
        run: |
          npm ci
          npm run dist
      - name: Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: librium-windows
          if-no-files-found: error
          path: |
            dist/v*/**/*.exe
            !dist/v*/**/*-unpacked/**
            !dist/v*/**/*.blockmap
            !dist/v*/**/builder-*.yml
      - name: macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: librium-macos
          if-no-files-found: error
          path: |
            dist/v*/**/*.dmg
            dist/v*/**/*.zip
            !dist/v*/**/*-unpacked/**
            !dist/v*/**/*.blockmap
            !dist/v*/**/builder-*.yml
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            dist/v*/*.exe
            dist/v*/*.dmg
            dist/v*/*.zip
