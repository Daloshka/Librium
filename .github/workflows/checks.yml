name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source publication scan
        run: python scripts/export-source.py --check
      - name: JavaScript checks
        run: |
          npm ci
          npm run test:ui
      - name: Rust toolchain
        run: rustup update stable
      - name: Rust checks
        run: |
          cargo fmt --check
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
